<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <style>
      @keyframes rainbow {
        0%   { stop-color: #ff0044; }
        16%  { stop-color: #ff8800; }
        33%  { stop-color: #ffee00; }
        50%  { stop-color: #00ff88; }
        66%  { stop-color: #0088ff; }
        83%  { stop-color: #8800ff; }
        100% { stop-color: #ff0044; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50%      { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-8px); }
      }
      @keyframes drift {
        0%   { transform: translate(0, 0); opacity: 0; }
        10%  { opacity: 0.8; }
        90%  { opacity: 0.8; }
        100% { transform: translate(40px, -40px); opacity: 0; }
      }
      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.4; }
        50%      { opacity: 1; }
      }
      @keyframes shimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes borderFlow {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      .title-glow { animation: glowPulse 2s ease-in-out infinite; }
      .particle { animation: drift 4s ease-in-out infinite; }
      .particle:nth-child(2n) { animation-duration: 5s; animation-delay: -1s; }
      .particle:nth-child(3n) { animation-duration: 3.5s; animation-delay: -2s; }
      .particle:nth-child(5n) { animation-duration: 6s; animation-delay: -3s; }
    </style>

    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff0044"><animate attributeName="stop-color" values="#ff0044;#ff8800;#ffee00;#00ff88;#0088ff;#8800ff;#ff0044" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="25%"  stop-color="#ff8800"><animate attributeName="stop-color" values="#ff8800;#ffee00;#00ff88;#0088ff;#8800ff;#ff0044;#ff8800" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="50%"  stop-color="#00ff88"><animate attributeName="stop-color" values="#00ff88;#0088ff;#8800ff;#ff0044;#ff8800;#ffee00;#00ff88" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="75%"  stop-color="#0088ff"><animate attributeName="stop-color" values="#0088ff;#8800ff;#ff0044;#ff8800;#ffee00;#00ff88;#0088ff" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#8800ff"><animate attributeName="stop-color" values="#8800ff;#ff0044;#ff8800;#ffee00;#00ff88;#0088ff;#8800ff" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff0066"/>
      <stop offset="50%"  stop-color="#6600ff"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff0044"><animate attributeName="stop-color" values="#ff0044;#00ff88;#0088ff;#ff0044" dur="3s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#0088ff"><animate attributeName="stop-color" values="#0088ff;#ff0044;#00ff88;#0088ff" dur="3s" repeatCount="indefinite"/></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" rx="16" fill="#07070d"/>
  <rect x="2" y="2" width="796" height="236" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-dasharray="20 10" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-60" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Grid pattern background -->
  <g opacity="0.04">
    <line x1="0" y1="40" x2="800" y2="40" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="560" y1="0" x2="560" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="240" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="240" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- Particles -->
  <circle cx="80" cy="50" r="2" fill="#ff0044" class="particle"/>
  <circle cx="200" cy="30" r="1.5" fill="#00ff88" class="particle"/>
  <circle cx="600" cy="60" r="2.5" fill="#0088ff" class="particle"/>
  <circle cx="700" cy="40" r="1.5" fill="#ff8800" class="particle"/>
  <circle cx="150" cy="190" r="2" fill="#8800ff" class="particle"/>
  <circle cx="650" cy="200" r="1.5" fill="#ffee00" class="particle"/>
  <circle cx="350" cy="25" r="1" fill="#ffffff" class="particle"/>
  <circle cx="500" cy="210" r="2" fill="#ff0066" class="particle"/>
  <circle cx="100" cy="120" r="1" fill="#00ccff" class="particle"/>
  <circle cx="720" cy="150" r="1.5" fill="#00ff88" class="particle"/>

  <!-- Soft glow behind title -->
  <ellipse cx="400" cy="105" rx="250" ry="45" fill="#4400aa" opacity="0.15" class="title-glow"/>

  <!-- Decorative rings -->
  <circle cx="400" cy="105" r="100" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08" style="animation: spin 20s linear infinite; transform-origin: 400px 105px;"/>

  <!-- Main title background shimmer -->
  <rect x="150" y="55" width="500" height="70" rx="8" fill="url(#rainbow)" opacity="0.06">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main title -->
  <text x="400" y="112" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="68" font-weight="900" fill="url(#rainbow)" filter="url(#glow)" letter-spacing="3">
    NOXPAN
  </text>

  <!-- Version badge -->
  <rect x="340" y="125" width="120" height="24" rx="12" fill="none" stroke="url(#rainbow)" stroke-width="1.5" opacity="0.7"/>
  <text x="400" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="url(#rainbow)" letter-spacing="2">
    V 3 . 0
  </text>

  <!-- Subtitle -->
  <text x="400" y="178" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#555577" letter-spacing="6">
    MULTI-GAME ROBLOX SCRIPT HUB
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline -->
  <text x="400" y="198" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#333355" letter-spacing="3" font-style="italic">
    PREMIUM FISHING AUTOMATION &bull; ESP &bull; PLAYER BOOSTS
  </text>

  <!-- Bottom accent bar -->
  <rect x="250" y="218" width="300" height="3" rx="1.5" fill="url(#rainbow)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
